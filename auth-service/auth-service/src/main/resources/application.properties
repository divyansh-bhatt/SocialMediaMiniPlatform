# Server
server.port=8081

# Application name
spring.application.name=auth-service

# MySQL Database
spring.datasource.url=jdbc:mysql://localhost:3306/connectsphere_auth?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=divyansh
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
jwt.secret=connectsphere_super_secret_key_change_this_in_production_min_32_chars
jwt.expiration=86400000

# Logging
logging.level.com.connectsphere=DEBUG
logging.level.org.springframework.security=INFO
