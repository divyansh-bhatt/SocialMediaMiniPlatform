# search-service runs on port 8088
server.port=8088
spring.application.name=search-service

# ── MySQL — stores Hashtag and PostHashtag tables ─────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/connectsphere_search?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=divyansh
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ── Elasticsearch ─────────────────────────────────────────────────────────────
# Elasticsearch 8.x runs on port 9200 by default.
# Install: https://www.elastic.co/downloads/elasticsearch
# Start:   bin/elasticsearch  (Windows: bin\elasticsearch.bat)
# Verify:  curl http://localhost:9200
#
# IMPORTANT: Elasticsearch 8.x enables security (TLS + auth) by default.
# For local development, disable security in elasticsearch.yml:
#   xpack.security.enabled: false
#   xpack.security.http.ssl.enabled: false
spring.elasticsearch.uris=http://localhost:9200
# If you kept security enabled, uncomment and fill these:
# spring.elasticsearch.username=elastic
# spring.elasticsearch.password=your-password

# ── JWT ───────────────────────────────────────────────────────────────────────
jwt.secret=connectsphere_super_secret_key_change_this_in_production_min_32_chars

# ── Inter-service URLs ────────────────────────────────────────────────────────
# search-service calls post-service to fetch post content for indexing
post.service.url=http://localhost:8082
# search-service calls auth-service to fetch user data for user search
auth.service.url=http://localhost:8081

logging.level.com.connectsphere=DEBUG
logging.level.org.springframework.data.elasticsearch=DEBUG
