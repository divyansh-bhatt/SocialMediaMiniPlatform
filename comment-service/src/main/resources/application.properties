# Server comment-service runs on port 8083
server.port=8083

spring.application.name=comment-service

# MySQL  own schema, separate from auth and post
spring.datasource.url=jdbc:mysql://localhost:3306/connectsphere_comment?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=divyansh
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT MUST be identical to auth-service and post-service
jwt.secret=connectsphere_super_secret_key_change_this_in_production_min_32_chars

# Inter-service URLs
# comment-service calls post-service to update post comment counters
post.service.url=http://localhost:8082
# comment-service calls auth-service to resolve @username -> userId and userId -> username
auth.service.url=http://localhost:8081

# comment-service fires notifications to notification-service
notification.service.url=http://localhost:8086
# Logging
logging.level.com.connectsphere=DEBUG
