server.port=8084
spring.application.name=like-service

spring.datasource.url=jdbc:mysql://localhost:3306/connectsphere_like?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=divyansh
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

jwt.secret=connectsphere_super_secret_key_change_this_in_production_min_32_chars

# Inter-service URLs like-service calls post-service and comment-service to update counters
post.service.url=http://localhost:8082
comment.service.url=http://localhost:8083
# like-service fires LIKE notifications to notification-service
notification.service.url=http://localhost:8086
# like-service calls auth-service to resolve userId -> username for notification messages
auth.service.url=http://localhost:8081

logging.level.com.connectsphere=DEBUG
